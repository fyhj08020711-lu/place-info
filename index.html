<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店家資訊查詢</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--text:#1d2433;--sub:#6b7488;--accent:#2563eb;--line:#e3e7ef;--ok:#16a34a;--bad:#dc2626}
  @media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--text:#e8ecf4;--sub:#9aa4b8;--accent:#6ea0ff;--line:#2a3247}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.4rem;margin:8px 0 16px}
  form{display:flex;gap:8px}
  input[type=search]{flex:1;font-size:1rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  button{font-size:1rem;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  .opts{margin:10px 2px;font-size:.9rem;color:var(--sub)}
  .opts label{display:inline-flex;align-items:center;gap:6px}
  #status{margin:14px 2px;color:var(--sub);font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .card h2{font-size:1.1rem;margin:0 0 4px}
  .tag{display:inline-block;font-size:.75rem;background:var(--bg);color:var(--sub);border-radius:6px;padding:2px 8px;margin:0 6px 8px 0}
  .open{color:var(--ok)} .closed{color:var(--bad)}
  dl{margin:8px 0 0;display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:.93rem}
  dt{color:var(--sub)} dd{margin:0;word-break:break-all}
  details{margin-top:2px} summary{cursor:pointer;color:var(--accent)}
  .links{display:flex;gap:14px;margin-top:12px;font-size:.93rem;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none}
  .foot{margin-top:24px;font-size:.8rem;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 店家／地點資訊查詢</h1>
  <form id="f">
    <input id="q" type="search" placeholder="輸入店家或地點名稱，例如：鼎泰豐" autocomplete="off" required>
    <button id="btn" type="submit">查詢</button>
  </form>
  <div class="opts"><label><input type="checkbox" id="near"> 以我的位置優先</label></div>
  <div id="status"></div>
  <div id="out"></div>
  <div class="foot">資料來源：Google Places</div>
</div>

<script>
const API_KEY = 'AIzaSyAfdkBzgxSWCzG45MLL6gKA5yqxXZifji8';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRICE = {PRICE_LEVEL_FREE:'免費',PRICE_LEVEL_INEXPENSIVE:'$ 平價',PRICE_LEVEL_MODERATE:'$$ 中等',PRICE_LEVEL_EXPENSIVE:'$$$ 偏高',PRICE_LEVEL_VERY_EXPENSIVE:'$$$$ 高價'};
const FIELDS = ['places.id','places.displayName','places.formattedAddress','places.nationalPhoneNumber',
  'places.rating','places.userRatingCount','places.priceLevel','places.priceRange','places.websiteUri',
  'places.googleMapsUri','places.primaryTypeDisplayName','places.regularOpeningHours','places.currentOpeningHours','places.parkingOptions','places.location','places.editorialSummary','places.reviews'].join(',');

function reviewsHtml(p){
  const R = (p.reviews || []).slice(0, 5);
  if(!R.length) return '';
  const body = R.map(v => {
    const a = v.authorAttribution || {};
    const who = a.uri ? `<a target="_blank" rel="noopener" href="${esc(a.uri)}">${esc(a.displayName || '使用者')}</a>` : esc(a.displayName || '使用者');
    const t = (v.text && v.text.text) || (v.originalText && v.originalText.text) || '';
    return `<div style="margin:8px 0;padding-top:8px;border-top:1px solid var(--line)">
      <b>${'⭐'.repeat(Math.round(v.rating || 0))}</b> ${who}
      <span style="color:var(--sub);font-size:.8rem">${esc(v.relativePublishTimeDescription || '')}</span>
      <div style="margin-top:4px">${esc(t)}</div></div>`;
  }).join('');
  return `<details><summary>查看 ${R.length} 則評論</summary>${body}</details>`;
}

const PARK_LABEL = {freeParkingLot:'免費停車場',paidParkingLot:'收費停車場',freeGarageParking:'免費車庫',paidGarageParking:'收費車庫',valetParking:'代客泊車',freeStreetParking:'免費路邊停車',paidStreetParking:'收費路邊停車'};
const OWN_LOT = ['freeParkingLot','paidParkingLot','freeGarageParking','paidGarageParking','valetParking'];

function parkInfo(p){
  const o = p.parkingOptions || {};
  const all = Object.keys(PARK_LABEL).filter(k => o[k] === true);
  return {own: OWN_LOT.some(k => o[k] === true), labels: all.map(k => PARK_LABEL[k])};
}

function distM(a, b, c, d){
  const R = 6371000, t = x => x * Math.PI / 180;
  const h = Math.sin(t(c-a)/2)**2 + Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

async function loadNearbyParking(p, box){
  box.innerHTML = '<span style="color:var(--sub)">搜尋附近停車場中…</span>';
  try{
    const lat = p.location.latitude, lon = p.location.longitude;
    const r = await fetch('https://places.googleapis.com/v1/places:searchNearby', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':API_KEY,
        'X-Goog-FieldMask':'places.displayName,places.formattedAddress,places.location,places.googleMapsUri,places.currentOpeningHours,places.parkingOptions'},
      body:JSON.stringify({includedTypes:['parking'], maxResultCount:5, rankPreference:'DISTANCE', languageCode:'zh-TW',
        locationRestriction:{circle:{center:{latitude:lat, longitude:lon}, radius:500}}})
    });
    const j = await r.json();
    if(!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    const L = j.places || [];
    if(!L.length){ box.innerHTML = '500 公尺內找不到停車場。'; return; }
    box.innerHTML = L.map(x => {
      const d = distM(lat, lon, x.location.latitude, x.location.longitude);
      const open = x.currentOpeningHours && x.currentOpeningHours.openNow;
      return `<div style="margin:4px 0">🅿️ <a target="_blank" rel="noopener" href="${esc(x.googleMapsUri)}">${esc(x.displayName ? x.displayName.text : '停車場')}</a>
        約 ${d} 公尺${open === true ? ' <span class="open">營業中</span>' : open === false ? ' <span class="closed">休息中</span>' : ''}<br>
        <span style="color:var(--sub);font-size:.85rem">${esc(x.formattedAddress || '')}</span></div>`;
    }).join('');
  }catch(err){
    box.innerHTML = '附近停車場查詢失敗：' + esc(err.message);
  }
}

const getPos = () => new Promise(res => {
  if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude}), () => res(null), {timeout:6000});
});

function priceText(p){
  const r = p.priceRange;
  if(r && r.startPrice){
    const cur = r.startPrice.currencyCode === 'TWD' ? 'NT$' : (r.startPrice.currencyCode + ' ');
    const a = r.startPrice.units, b = r.endPrice && r.endPrice.units;
    return `${cur}${a}${b ? '–' + b : '以上'}`;
  }
  return PRICE[p.priceLevel] || '';
}

function render(list){
  if(!list.length){ $('out').innerHTML=''; $('status').textContent='找不到相關資訊，請換個關鍵字試試。'; return; }
  $('status').textContent = `找到 ${list.length} 筆相關結果`;
  $('out').innerHTML = list.map((p, i) => {
    const name = p.displayName ? p.displayName.text : '';
    const openNow = p.currentOpeningHours && p.currentOpeningHours.openNow;
    const hours = p.regularOpeningHours && p.regularOpeningHours.weekdayDescriptions;
    const price = priceText(p);
    const pk = parkInfo(p);
    const intro = p.editorialSummary && p.editorialSummary.text;
    const rv = reviewsHtml(p);
    const rows = [
      intro && ['介紹', esc(intro)],
      ['停車', pk.own
        ? `✅ 有附設停車場（${esc(pk.labels.join('、'))}）`
        : `未標示附設停車場${pk.labels.length ? '（' + esc(pk.labels.join('、')) + '）' : ''}<div class="np" data-i="${i}" style="margin-top:6px"></div>`],
      ['地址', esc(p.formattedAddress)],
      p.nationalPhoneNumber && ['電話', `<a href="tel:${esc(p.nationalPhoneNumber)}">${esc(p.nationalPhoneNumber)}</a>`],
      p.rating && ['評價', `⭐ ${p.rating}（${p.userRatingCount ?? 0} 則）`],
      price && ['價格', esc(price)],
      rv && ['評論', rv],
      hours && ['營業時間', `<details><summary>查看每週時間</summary>${hours.map(esc).join('<br>')}</details>`],
    ].filter(Boolean).map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    return `<div class="card">
      <h2>${esc(name)}</h2>
      ${p.primaryTypeDisplayName ? `<span class="tag">${esc(p.primaryTypeDisplayName.text)}</span>` : ''}
      ${openNow === true ? '<span class="tag open">營業中</span>' : openNow === false ? '<span class="tag closed">休息中</span>' : ''}
      <dl>${rows}</dl>
      <div class="links">
        ${p.googleMapsUri ? `<a target="_blank" rel="noopener" href="${esc(p.googleMapsUri)}">📍 Google 地圖</a>` : ''}
        ${p.websiteUri ? `<a target="_blank" rel="noopener" href="${esc(p.websiteUri)}">🌐 官方網站</a>` : ''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.np').forEach(box => {
    const p = list[+box.dataset.i];
    if(p && p.location) loadNearbyParking(p, box);
  });
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if(!q) return;
  $('btn').disabled = true; $('out').innerHTML=''; $('status').textContent='查詢中…';
  try{
    const body = {textQuery:q, languageCode:'zh-TW', regionCode:'TW', pageSize:10};
    if($('near').checked){
      const pos = await getPos();
      if(pos) body.locationBias = {circle:{center:{latitude:pos.lat, longitude:pos.lon}, radius:5000}};
    }
    const r = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':API_KEY,'X-Goog-FieldMask':FIELDS},
      body:JSON.stringify(body)
    });
    const j = await r.json();
    if(!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    render(j.places || []);
  }catch(err){
    $('status').textContent = '查詢失敗：' + err.message;
  }finally{
    $('btn').disabled = false;
  }
});
</script>
</body>
</html>
